[project]
name = "ai-code-review-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "redis>=5,<7", "rq>=1.16,<3", "pyjwt[crypto]>=2.8,<3", "ruff>=0.6,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "fakeredis[lua]>=2.26,<3"]

[project.scripts]
review-agent = "review_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["review_agent*"]

[tool.setuptools.package-data]
review_agent = ["static/*", "static/assets/*"]
