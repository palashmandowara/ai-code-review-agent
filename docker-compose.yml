services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://review:review@db:5432/review
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
  worker:
    build: .
    command: rq worker reviews --url redis://redis:6379/0 --with-scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://review:review@db:5432/review
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
volumes:
  pgdata:
